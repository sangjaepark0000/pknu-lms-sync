[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pknu-lms-sync"
version = "0.1.0"
description = "부경대학교 LMS 강의자료·과제 첨부파일 동기화 도구"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PKNU LMS Sync contributors"}]
keywords = ["pknu", "lms", "ilos", "backup"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.31,<3",
]

[project.scripts]
pknu-lms-sync = "pknu_lms_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
